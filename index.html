<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Tanisha ❤️</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(45deg, #ff9a9e, #fad0c4);
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    overflow-x: hidden;
    padding: 20px;
    transition: 0.6s ease;
}

/* When YES is confirmed */
.second-page {
    justify-content: flex-start;
    padding-top: 120px; /* Controls how much down */
}

/* Text */
h1 {
    font-size: clamp(2rem, 5vw, 3rem);
    color: white;
    margin-bottom: 10px;
}

p {
    font-size: clamp(1rem, 3vw, 1.3rem);
    color: white;
}

/* Buttons */
button {
    margin: 12px;
    padding: 14px 28px;
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
}

#accept {
    background: #4CAF50;
    color: white;
}

#reject {
    background: #ff4d4d;
    color: white;
    position: fixed;
}

/* Video Section */
#showreelSection {
    display: none;
    width: 100%;
    max-width: 800px;
    animation: fadeIn 1s ease forwards;
}

video {
    max-height: 80vh;
    max-width: 100%;
    border-radius: 20px;
    margin-top: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

/* Floating Hearts */
.heart {
    position: fixed;
    color: red;
    font-size: 22px;
    animation: float 4s linear infinite;
}

@keyframes float {
    0% { transform: translateY(100vh); opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Mobile */
@media (max-width: 600px) {
    button {
        width: 70%;
    }
}
</style>
</head>

<body>

<h1>❤️ Tanisha ❤️</h1>
<p id="question">Will you be my valentine? 💌</p>

<button id="accept">YES 💍</button>
<button id="reject">NO 🙈</button>

<div id="showreelSection">
    <p> I Think we are soul-mates, aren’t we?.</p>
    <video controls>
        <source src="img-1051.mp4" type="video/mp4">
    </video>
</div>

<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const rejectBtn = document.getElementById("reject");
const acceptBtn = document.getElementById("accept");
const showreel = document.getElementById("showreelSection");
const music = document.getElementById("music");
const question = document.getElementById("question");

let yesClicks = 0;

const messages = [
"Are you sure? 😏",
"Think again 🤨",
"Still clicking? 👀",
"You really mean YES? 💭",
"Okay okay... one more click 😭"
];

/* Random position for NO button */
function moveButton(btn) {
    const maxX = window.innerWidth - btn.offsetWidth;
    const maxY = window.innerHeight - btn.offsetHeight;

    btn.style.left = Math.random() * maxX + "px";
    btn.style.top = Math.random() * maxY + "px";
}

moveButton(rejectBtn);

rejectBtn.addEventListener("mouseover", () => moveButton(rejectBtn));
rejectBtn.addEventListener("touchstart", () => moveButton(rejectBtn));

/* Floating hearts */
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "❤️";
    heart.style.left = Math.random() * 100 + "vw";

    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 4000);
}

/* Confetti */
function confetti() {
    for (let i = 0; i < 80; i++) {
        const c = document.createElement("div");
        c.innerText = "💖";
        c.style.position = "fixed";
        c.style.left = Math.random() * 100 + "vw";
        c.style.top = Math.random() * 100 + "vh";
        c.style.fontSize = "20px";

        document.body.appendChild(c);
        setTimeout(() => c.remove(), 2000);
    }
}

/* YES click logic */
acceptBtn.addEventListener("click", () => {
    music.play();
    yesClicks++;

    if (yesClicks <= 5) {
        acceptBtn.innerText = messages[yesClicks - 1];
    }

    if (yesClicks === 5) {

        document.body.classList.add("second-page");

        document.querySelector("h1").innerText = "She Said YES ❤️";
        question.style.display = "none";
        acceptBtn.style.display = "none";
        rejectBtn.style.display = "none";

        showreel.style.display = "block";
        showreel.scrollIntoView({ behavior: "smooth" });

        confetti();
        setInterval(createHeart, 300);
    }
});
</script>

</body>
</html>
